# moe-mint config for moe-backstory.
#
# The platform registry resolves this source package and config. Compiled Mint
# assembles its declared components/payloads, exact validated adapter output,
# legal files, and root package metadata into the shared `plugins.next-<nonce>`
# sibling. This config remains source-only and is never copied into the plugin.

name: moe-backstory
version: 0.1.4
description: Recover a behavioral spec from a codebase that never had one.
author:
  name: Zak Keown
  email: zak.keown@outlook.com
license: Apache-2.0
repository: https://github.com/zak-keown/moe
homepage: https://github.com/zak-keown/moe
keywords:
  - reverse-engineering
  - specification
  - analysis
  - archaeology
  - documentation

distribution:
  npm: "@bubstack/moe-backstory"

artifact:
  payloads: []

targets:
  claude-code: {intent: certify, expected_capabilities: [skill-discovery, command-discovery, agent-discovery], operating_systems: [macos, linux, wsl2, windows]}
  cursor: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2, windows]}
  codex: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2, windows]}
  kimi: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2, windows]}
  opencode: {intent: preview, expected_capabilities: [skill-discovery, command-discovery, agent-discovery], operating_systems: [macos, linux, wsl2, windows]}
  pi: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2, windows]}
  agent-plugins-1.0: {intent: preview, expected_capabilities: [skill-discovery, format-conformance]}
  copilot: {intent: preview, expected_capabilities: [skill-discovery, command-discovery, agent-discovery], operating_systems: [macos, linux, wsl2, windows]}

# bootstrap: none.
#
# 22 skills, and every one of them belongs to a job you start deliberately:
# "recover a spec for this codebase". Injecting any of it at session start would
# load an archaeology pipeline into sessions doing ordinary work. The two
# commands (`/analyze`, `/sanitize`) are the entry points, and a command is an
# explicit invocation by definition.
bootstrap: none

# components: skills/, commands/ and agents/ are defaults and all present. No
# hooks/hooks.json and no .mcp.json in this package.

# harnesses: no exclusions. All 8 adapters run. Note that not every harness has
# a commands/ concept; the adapters that do not simply omit them, which is why
# the two commands are not duplicated as skills.

imported_works:
  - name: greenfield

marketplace:
  # Standalone generation uses this package-local name. Root minting overrides
  # it with the default profile ID `core` and generates the npm-backed root
  # marketplace from validated registry authority.
  name: moe
  source: local
  category: development
  tags:
    - analysis
    - documentation
