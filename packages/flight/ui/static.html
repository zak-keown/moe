<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flight run report</title>
    <script type="application/json" id="__MOE_FLIGHT_RUN__">{}</script>
    <script>
      // Hydrate window.__MOE_FLIGHT_RUN__ from the inline JSON above. The
      // runtime renderer replaces the JSON contents per run; this glue
      // is build-time-stable.
      try {
        const node = document.getElementById("__MOE_FLIGHT_RUN__");
        if (node?.textContent && node.textContent.trim() !== "{}") {
          window.__MOE_FLIGHT_RUN__ = JSON.parse(node.textContent);
        }
      } catch (e) { console.error("Failed to parse __MOE_FLIGHT_RUN__", e); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/static.tsx"></script>
  </body>
</html>
