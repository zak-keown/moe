# moe-mint config for the FULL plugin, moe-everything.
#
# The same source tree as ./moe-core.yaml with every skill instead of the lean
# thirteen. See that file's header for how staging makes two plugins from one
# tree possible, and ../skill-tiers.yaml for which skill lands where.
#
# moe-everything is a strict SUPERSET of moe-core: 13 + 14 = 27. Installing both
# is not an error but buys nothing, and the marketplace descriptions say so.
#
# Everything below that is not the identity — name, description, keywords — is
# deliberately identical to moe-core.yaml. If the two ever need to differ in
# behaviour, that is a decision worth a comment here rather than a silent drift,
# and `pnpm mint:check` will not catch it: it asserts the OUTPUT is reproducible,
# not that the two configs agree.

name: moe-everything
version: 0.0.0-tc.1
# No skill count here, deliberately. A number in a SHIPPED description rots on
# the first authored skill, and it rots in twelve places at once because mint
# byte-copies this string into every harness manifest. The count lives in
# skill-tiers.yaml, where a test asserts it.
description: >-
  The full Moe skill library, including the ones you invoke deliberately by name.
author:
  name: Zak Keown
  email: zak@turncommerce.com
license: MIT AND Apache-2.0
repository: https://gitlab.tcdevops.com/Zak/moe
homepage: https://gitlab.tcdevops.com/Zak/moe
keywords:
  - skills
  - brainstorming
  - planning
  - tdd
  - debugging
  - code-review
  - workflow
  - writing
  - windows
  - plugin-authoring

# Same bootstrap as the lean plugin, and it has to be: `using-moe` is what makes
# every other skill fire without being asked for, and it is a core-tier skill so
# it is present in both stagings. See moe-core.yaml for the note on the wrapper
# string change, which applies identically here.
bootstrap:
  skill: using-moe

# components: all defaults. No commands/ and no .mcp.json in this package.
# agents/ is present — retrieving-context's two haiku search agents, staged from
# packages/core/agents/ like every other component here. hooks/hooks.json
# carries Stop and SessionStart hooks plus the same opt-in, fail-open PreToolUse
# governance guard as moe-core. Mint also merges its own SessionStart entry into
# hooks/moe-mint/hooks.json.

# harnesses: no exclusions. All 8 adapters run.

marketplace:
  # The marketplace users actually install from is the hand-maintained root
  # .claude-plugin/marketplace.json, whose name is `moe`. Without this, every
  # generated install doc emits `<plugin>@<plugin>-dev` (the local-dev default
  # in src/adapters/shared.ts, marketplaceName) — a marketplace that does not
  # exist, in the one command a new user copies verbatim.
  name: moe
  source: local
  category: development
  tags:
    - skills
    - workflow

release:
  audit:
    exclude:
      - skills/developing-claude-code-plugins/examples
