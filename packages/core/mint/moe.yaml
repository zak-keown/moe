# moe-mint config for the `moe` plugin.
#
# Preserved from the-elements-of-style's `everyharness.yaml` @ 05fc4f0 — the only
# real upstream consumer of the plugin generator, and therefore the seed of this
# pipeline. Every field below was rewritten; the file's shape and its habit of
# explaining each non-obvious choice in a comment are what survived.
#
# HOW THIS IS BUILT. The platform registry resolves this file and its source
# package without copying either into output. `scripts/mint-plugins.mjs` asks
# compiled Mint to assemble declared components and payloads, run the exact
# canonical adapter validation/write pass, compose legal and package metadata,
# and preflight every plugin in one fresh `plugins.next-<nonce>` sibling.
#
# One plugin now comes from this source tree:
#
#   - One plugin from one source tree. This used to be two — `moe-core` (a lean
#     everyday set) and `moe-everything` (all of them). Consolidated 2026-09-01:
#     the resident cost of shipping all 27 name+description pairs is roughly
#     1.5k tokens a session (bodies load on demand), which is not a budget
#     worth curating against, and having two plugins with a superset
#     relationship was more confusion than value at install time.
#     `skill-tiers.yaml` still records why each skill is here as a fidelity
#     ledger; it no longer partitions them. All 8 adapters now contribute only
#     their owned files/package namespaces to the compositor's root manifest.

name: moe
version: 0.1.4
# No skill count in the description, deliberately. A number in a SHIPPED
# description rots on the first authored skill, and it rots in twelve places at
# once because mint byte-copies this string into every harness manifest. The
# count lives in skill-tiers.yaml, where a test asserts it.
description: >-
  The Moe skill library — brainstorming, planning, TDD, systematic debugging,
  code review, worktrees, parallel dispatch, plugin authoring, and more.
author:
  name: Zak Keown
  email: zak.keown@outlook.com
license: MIT AND Apache-2.0
repository: https://github.com/zak-keown/moe
homepage: https://github.com/zak-keown/moe
keywords:
  - skills
  - brainstorming
  - planning
  - tdd
  - debugging
  - code-review
  - workflow
  - writing
  - plugin-authoring

distribution:
  npm: "@bubstack/moe-core"

artifact:
  payloads: []

targets:
  claude-code: {intent: certify, expected_capabilities: [skill-discovery, agent-discovery, hook-execution, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}
  cursor: {intent: preview, expected_capabilities: [skill-discovery, hook-execution, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}
  codex: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2, windows]}
  kimi: {intent: preview, expected_capabilities: [skill-discovery, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}
  opencode: {intent: preview, expected_capabilities: [skill-discovery, agent-discovery, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}
  pi: {intent: preview, expected_capabilities: [skill-discovery, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}
  agent-plugins-1.0: {intent: preview, expected_capabilities: [skill-discovery, format-conformance]}
  copilot: {intent: preview, expected_capabilities: [skill-discovery, agent-discovery, hook-execution, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}

# The bootstrap skill is what makes the rest fire without being asked for; every
# harness reads it at session start. moe-mint wraps it in
# `<plugin-bootstrap plugin="moe">` and marks it as already loaded.
bootstrap:
  skill: using-moe

# Most components use their defaults (skills/, commands/, agents/, .mcp.json).
# Core stages the complete hooks/ component because hooks/hooks.json invokes
# sibling executables; hook-execution would be incomplete if only the manifest
# were copied. This package has no commands/ and no .mcp.json. It does have
# agents/ — retrieving-context's search agent, picked up by the default.
components:
  hooks: hooks

# harnesses: no exclusions. All 8 adapters run; the composed root package
# manifest keeps package ownership separate from adapter emission.

marketplace:
  # Standalone generation uses this package-local name. Root minting overrides
  # it with the default profile ID `core` and generates the repository
  # marketplace from the platform registry and package npm identities.
  name: moe
  # The package-local descriptor remains a local-development artifact; the
  # generated root marketplace publishes npm-backed entries.
  source: local
  category: development
  tags:
    - skills
    - workflow

imported_works:
  - name: superpowers
  - name: superpowers-lab
  - name: superpowers-developing-for-claude-code
  - name: iterative-development
  - name: the-elements-of-style
  - name: double-shot-latte
  - name: mattpocock-skills
  - name: open-gsd/gsd-core

release:
  audit:
    # `moe-mint bump --audit` sweeps the package source root for stray copies
    # of the current version string. The developing-claude-code-plugins example
    # remains exempt because its plugin.json carries that example's version,
    # not this plugin's.
    exclude:
      - skills/developing-claude-code-plugins/examples
