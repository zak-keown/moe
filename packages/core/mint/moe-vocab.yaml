blocks:
  model-dispatch-guidance:
    claude-code: |
      **Dispatch model selection:** The `Agent` tool supports a call-level
      `model` field. Every dispatch must set its `model` field explicitly to
      the model assigned by the selected role in Model Selection.
    cursor: |
      **Dispatch model selection:** Set the selected role explicitly when the
      installed `Agent` schema exposes a `model` field. Otherwise use the model
      configured for that subagent type; do not invent an unsupported field.
    codex: |
      **Dispatch model selection:** Every `spawn_agent` call must set `model`
      and `reasoning_effort` explicitly, resolving the selected role against
      the current spawn allowlist before dispatch.
    kimi: |
      **Dispatch model selection:** Kimi's `Agent` surface used here does not
      expose a portable call-level model override. Route the selected role
      through the model configured for the chosen Kimi subagent type, or use
      the configured default when no role-specific choice exists. Do not
      invent a `model` field.
    opencode: |
      **Dispatch model selection:** OpenCode's `task` surface used here does
      not expose a call-level model override. Route the selected role through
      the configured `general` agent, or use its configured default. Do not
      invent a `model` field.
    pi: |
      **Dispatch model selection:** Pass a call-level model override only when
      the installed subagent tool documents that field. Otherwise route the
      selected role through the tool's configured subagent profile, or use the
      configured default. Do not invent an unsupported field.
    agent-plugins-1.0: |
      **Dispatch model selection:** `invoke_subagent` does not define a
      call-level model override. Route roles through configured `self` or
      `research` `TypeName` behavior, using the configured default when no
      role-specific choice exists. Do not invent a `model` parameter.
    copilot: |
      **Dispatch model selection:** The `Agent` tool supports a call-level
      `model` field. Every dispatch must set its `model` field explicitly to
      the model assigned by the selected role in Model Selection.
  bootstrap-context:
    claude-code: |
      This bootstrap is actively injected at session start and is already
      loaded. Follow it now. Do not use the `Skill` tool to load `using-moe`
      again; use that mechanism for every other skill.
    cursor: |
      This bootstrap is actively injected at session start and is already
      loaded. Follow it now. Do not use the `Skill` tool to load `using-moe`
      again; use that mechanism for every other skill.
    codex: |
      Codex provides native skill discovery only; this bootstrap is not
      injected at session start. If you explicitly loaded `using-moe`, follow
      it now and use native skill discovery for every other skill. Do not
      assume it was preloaded merely because it is installed.
    kimi: |
      Kimi activates this named bootstrap skill at session start. Because you
      are reading the named bootstrap skill now, follow it without loading
      `using-moe` again. Use the `Skill` tool for every other skill.
    opencode: |
      This bootstrap is actively injected at session start and is already
      loaded. Follow it now. Do not use the `skill` tool to load `using-moe`
      again; use that mechanism for every other skill.
    pi: |
      This bootstrap is actively injected at session start and is already
      loaded. Follow it now. Do not reload `using-moe`; read every other
      skill's `SKILL.md` through Pi's configured skill discovery.
    agent-plugins-1.0: |
      Agent Plugins 1.0 has no bootstrap mechanism. If you loaded `using-moe`
      explicitly, follow it now and use native skill discovery for every other
      skill. Do not claim it was injected merely because the skill tree is
      installed.
    copilot: |
      This bootstrap is actively injected at session start and is already
      loaded. Follow it now. Do not use the `Skill` tool to load `using-moe`
      again; use that mechanism for every other skill.
  subagent-dispatch:
    claude-code: |
      Use the `Agent` tool. Pass a fully filled `prompt` and a short
      `description`; choose `subagent_type` deliberately — `general-purpose`
      for a task needing the full tool surface, `Explore` for read-only
      research, `fork` to hand a subagent a copy of this conversation so it
      shares your context and cache. A non-fork agent starts with zero
      context: brief it like a colleague who just walked in, never with
      "based on what we discussed." For independent work, send multiple
      `Agent` calls in a single message to dispatch them in parallel; keep
      dependent steps sequential.
    cursor: |
      Use the `Agent` tool with `subagent_type: "general-purpose"` for
      full-capability work or `subagent_type: "Explore"` for read-only
      research — the same shape as Claude Code. Pass a fully filled `prompt`
      and a short `description`. Cursor does not load this plugin's custom
      `agents/` definitions, so name a built-in subagent type rather than a
      project-defined one. Dispatch independent work with multiple `Agent`
      calls in one turn; keep dependent steps sequential.
    codex: |
      Requires `[features] multi_agent = true` in `~/.codex/config.toml`.
      Spawn children with `spawn_agent {fork_turns: "none"}` for a clean
      context — the default `"all"` copies your entire transcript in.
      Codex 0.145+ role files under `~/.codex/agents/` attach via
      `agent_type` on full-history forks; isolated forks are the default for
      context hygiene. Resume an implementer with `followup_task` rather
      than spawning a fresh one — it delivers your message and transparently
      reloads an evicted child. V2 has no `close_agent`; finished children
      are evicted automatically. Set `model` AND `reasoning_effort`
      explicitly on every spawn — `model` alone silently resets effort to
      that model's default. Never copy a model name into `spawn_agent`
      without checking it against your current spawn allowlist.
    kimi: |
      Use Kimi Code's `Agent` tool with a Kimi subagent type — never pass
      `general-purpose` as `subagent_type`. For implementation, code
      review, spec review, or any filled prompt template this plugin ships,
      call `Agent` with `subagent_type: "coder"`, paste the fully filled
      prompt into `prompt`, and give a short `description`. For read-only
      codebase exploration use `subagent_type: "explore"`; for read-only
      planning or architecture design use `subagent_type: "plan"`. Keep
      dependent steps sequential; use multiple `Agent` calls, or
      `run_in_background: true` when the work is independent and background
      agents are available.
    opencode: |
      Use the `task` tool with `subagent_type: "general"` for a
      `Subagent (general-purpose):` dispatch. Pass the fully filled prompt
      as the task description. Keep dependent steps sequential; issue
      multiple `task` calls in one turn for independent work.
    pi: |
      Pi core ships no standard subagent tool. If the `pi-subagents`
      package is installed, use its `subagent` tool — it supports
      single-agent, chain, parallel, async, forked-context, and
      resume/status workflows. If no subagent tool is available, do not
      fabricate `Task` calls: execute the work sequentially in the current
      session, or tell the user the optional subagent capability is not
      installed.
    agent-plugins-1.0: |
      Use `invoke_subagent` with a built-in `TypeName`: `self` for work that
      needs the full tool surface or `research` for read-only investigation.
      Pass a complete brief that stands on its own. Dispatch independent calls
      together when the client supports concurrent tool calls; otherwise use
      the skill's sequential fallback. Keep dependent steps sequential.
    copilot: |
      Use the `Agent` tool. Pass a fully filled `prompt` and a short
      `description`; choose `subagent_type` deliberately — `general-purpose`
      for a task needing the full tool surface, `Explore` for read-only
      research, `fork` to hand a subagent a copy of this conversation so it
      shares your context and cache. A non-fork agent starts with zero
      context: brief it like a colleague who just walked in, never with
      "based on what we discussed." For independent work, send multiple
      `Agent` calls in a single message to dispatch them in parallel; keep
      dependent steps sequential.
  subagent-wait:
    claude-code: |
      The `Agent` tool call itself blocks until the subagent finishes and
      returns its final report in the tool result — there is no separate
      polling step for a normal dispatch. For a background task, use the
      `Monitor` tool to stream progress rather than a manual poll loop; you
      are notified when the task completes. Read the subagent's report
      directly rather than re-deriving what it found, but verify any
      load-bearing claim (a bug fixed, a test passing) before treating it as
      final — a summary describes intent, not always fact.
    cursor: |
      Same as Claude Code: the `Agent` call blocks until the subagent
      returns its final report in the tool result — there is no separate
      wait step. Read the report directly rather than re-deriving its
      findings, but verify any load-bearing claim before treating it as
      final.
    codex: |
      `wait_agent` is an event subscription, not a poll: a long wait wakes
      the instant a child produces mailbox activity, at the same latency as
      a short one. Short-timeout polls buy nothing and cost a tool call and
      a context rebill each time — in measured sessions roughly two-thirds
      of them timed out for nothing. While you still have local work, do not
      wait at all; a completed child's final answer is pushed into your
      mailbox and arrives with your next turn. When genuinely idle with
      children outstanding, wait in bounded stretches of 300000-600000ms
      (5-10 minutes); after each stretch, post one status line, run
      `list_agents`, and chase any child that finished without reporting.
      Never stack polls shorter than five minutes — completion mail cannot
      wake an idle controller on its own, so covering that idle window is
      `wait_agent`'s only job.
    kimi: |
      Kimi Code's `Agent` tool call blocks until the subagent finishes and
      its result is returned in the tool response — there is no separate
      wait step for a normal dispatch. For agents dispatched with
      `run_in_background: true`, check back on their status before
      proceeding. Read each subagent's returned result directly rather than
      re-deriving its findings.
    opencode: |
      OpenCode's `task` tool call blocks until the subagent returns its
      result in the tool response — there is no separate polling step. Read
      the returned result directly; for multiple independent `task`
      dispatches issued in one turn, each result arrives before you
      continue.
    pi: |
      If the `pi-subagents` package's `subagent` tool is installed, use its
      resume/status workflow to check on an async or forked dispatch rather
      than polling ad hoc — call its status action and act on the result.
      When no subagent tool is installed, there is nothing to wait on: the
      work happens sequentially in the current session.
    agent-plugins-1.0: |
      A normal `invoke_subagent` call returns the subagent's report directly;
      there is no separate polling step. Read that report rather than
      re-deriving its findings, then verify load-bearing claims before treating
      them as final. If a particular client adds background execution, use its
      documented status mechanism rather than inventing a poll loop.
    copilot: |
      The `Agent` tool call itself blocks until the subagent finishes and
      returns its final report in the tool result — there is no separate
      polling step for a normal dispatch. For a background task, use the
      `Monitor` tool to stream progress rather than a manual poll loop; you
      are notified when the task completes. Read the subagent's report
      directly rather than re-deriving what it found, but verify any
      load-bearing claim (a bug fixed, a test passing) before treating it as
      final — a summary describes intent, not always fact.
  render-ladder:
    claude-code: |
      All four rungs are available. Where the `Artifact` tool is present,
      rung 1 is the default for anything with an audience. Otherwise start at
      rung 2 and drop further only when `node` is unavailable or the sandbox
      blocks the port. Announce which rung you took before the render lands.
    cursor: |
      The `Artifact` tool is not exposed in Cursor — start at rung 2 (the
      brainstorm browser companion) and drop to rung 3 (local HTML file) or
      rung 4 (markdown file) when `node` isn't on PATH or the sandbox blocks
      the port bind. Use the shared ladder's sharing default.
    codex: |
      Rung 1 (the Claude Code `Artifact` tool) is not exposed — start at
      rung 2 (the brainstorm browser companion)
      and fall through to rung 3 (local HTML file) or rung 4 (markdown file)
      when the sandbox blocks a port bind. Use the shared ladder's sharing
      default.
    kimi: |
      Rung 1 (the Claude Code `Artifact` tool) is not exposed — start at
      rung 2 (the brainstorm browser companion) and drop to rung 3 (local
      HTML file) or rung 4 (markdown file) when a browser is unavailable.
    opencode: |
      Rung 1 (the Claude Code `Artifact` tool) is not exposed — start at
      rung 2 (the brainstorm browser companion) and drop to rung 3 (local
      HTML file) or rung 4 (markdown file) when a browser is unavailable.
    pi: |
      Rung 1 (the Claude Code `Artifact` tool) is not exposed — start at
      rung 2 (the brainstorm browser companion) and drop to rung 3 (local
      HTML file) or rung 4 (markdown file) when a browser is unavailable.
    agent-plugins-1.0: |
      Rung 1 is unavailable. Start at rung 2, the brainstorm browser
      companion. If the client cannot bind or open the browser companion,
      fall directly to rung 4, a markdown file. A task artifact is not a
      substitute for a presentation artifact. Announce the rung you took.
    copilot: |
      All four rungs are available where the installed Claude-compatible tool
      surface exposes `Artifact`; otherwise start at rung 2 and drop further
      only when `node` is unavailable or the sandbox blocks the port. Announce
      which rung you took before the render lands.
