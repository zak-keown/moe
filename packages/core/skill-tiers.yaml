# The skill registry, as data.
#
# This file is the record of every skill this package ships. It has two jobs:
#
#   FIDELITY. `imported:` is a frozen ledger of the 27 upstream skills Moe
#   inherited. A diff inside that map is a fidelity decision, not an edit:
#   renaming, adding or dropping a key here fails test/metadata.test.ts against
#   the pinned name literal — that assertion is the drop-and-rename detector
#   for the whole import, and it is aimed at THIS map rather than at the
#   skills/ directory so that a fork-authored skill can arrive without
#   weakening it.
#
#   ACCOUNTING. `imported:` and `authored:` together must account for every
#   `SKILL.md` under packages/core/skills/, in exactly one map. test/metadata.test.ts
#   enforces this both ways: a skill on disk not in either map, or an entry in
#   either map with no skill on disk, is a fatal drift. `_shared/` has no
#   SKILL.md and is not counted (see scripts/mint-plugins.mjs → NON_SKILL_ENTRIES).
#
# It USED TO have a third job — a lean/full tier split that produced two
# generated plugins from the one source tree. That split was retired 2026-09-01:
# every skill now ships in the single `moe` plugin. The `tier:` field on each
# entry was dropped with the split. If a curation shape ever comes back, it
# goes on top of this ledger rather than inside it.
#
# ---------------------------------------------------------------------------
# imported: the fixed imported skill set. FROZEN.
#
# The `why:` on each entry is why the skill earns a place in the tree — it
# survived the 2026-08-31 split review with a rationale for shipping at all,
# and that rationale is retained even though the tier machinery it argued
# against is gone. Deleting a `why:` is a legitimate edit, but not silently.
# ---------------------------------------------------------------------------
imported:
  using-moe:
    from: imported
    why: >-
      The bootstrap. It is moe-mint's `bootstrap: { skill: }` target and the
      thing that makes every other skill fire at all.

  brainstorming:
    from: imported
    why: >-
      Its own description opens "You MUST use this before any creative work".
      Fires on every feature request, unasked. One of the two skills the
      bootstrap names by name.

  systematic-debugging:
    from: imported
    why: >-
      "Use when encountering any bug, test failure, or unexpected behavior."
      Fires on every bug, unasked. The other skill the bootstrap names.

  test-driven-development:
    from: imported
    why: >-
      "Use when implementing any feature or bugfix, before writing
      implementation code." Fires on every implementation. Also the REQUIRED
      BACKGROUND for systematic-debugging's failing-test step.

  verification-before-completion:
    from: imported
    why: >-
      "Use when about to claim work is complete." Fires at the end of every
      task, and systematic-debugging routes to it before any success claim.

  writing-plans:
    from: imported
    why: >-
      "Use when you have a spec or requirements for a multi-step task, before
      touching code." The step brainstorming hands off to; nobody asks for it
      by name.

  subagent-driven-development:
    from: imported
    why: >-
      writing-plans marks it "**REQUIRED SUB-SKILL**" as the recommended
      execution path, and it is the path every harness Moe targets can
      actually take.

  executing-plans:
    from: imported
    why: >-
      writing-plans marks it "**REQUIRED SUB-SKILL**" as the second of exactly
      two execution options — the one to take when subagents are unavailable.

  using-git-worktrees:
    from: imported
    why: >-
      Step 0 of both execution paths ("ensure an isolated workspace") and
      named by the bootstrap.

  finishing-a-development-branch:
    from: imported
    why: >-
      "**REQUIRED SUB-SKILL**" at the terminal step of both execution paths.
      Without it the everyday flow ends with the branch unmerged and no
      guidance.

  requesting-code-review:
    from: imported
    why: >-
      subagent-driven-development's review phase dispatches this skill's
      `code-reviewer.md` template. Also fires unasked on "before merging".

  receiving-code-review:
    from: imported
    why: >-
      Fires when review feedback arrives, which is ordinary work, and it is
      the counterpart to requesting-code-review. Shipping the request half
      without the receive half teaches half the loop.

  writing-clearly-and-concisely:
    from: imported
    why: >-
      Its trigger is literally "ANY prose humans will read", which includes
      the commit messages, MR descriptions and error text of every session.
      Fires unasked more often than anything else in the tree.

  dispatching-parallel-agents:
    from: imported
    why: >-
      "Use when facing 2+ independent tasks" is a recognition trigger.
      subagent-driven-development and implementing-tasks restate the parallel
      gate inline for the everyday paths; this skill remains the canonical
      source for the full gate, the degradation ladder, and the divergent-tree
      rule.

  writing-skills:
    from: imported
    why: >-
      You invoke it deliberately, when authoring or editing a skill. Also the
      largest skill in the set at 3,781 words.

  working-with-claude-code:
    from: imported
    why: >-
      A documentation router. You reach for it when you are already working on
      Claude Code configuration.

  developing-claude-code-plugins:
    from: imported
    why: >-
      You invoke it when you know you are building a plugin. Ships the example
      plugins and the polyglot-hook reference.

  finding-duplicate-functions:
    from: imported
    why: >-
      Experimental (upstream's own word). A codebase audit you run on purpose;
      it also wants `rg` and `jq` and dispatches two subagent tiers.

  mcp-cli:
    from: imported
    why: >-
      Experimental. Deliberate reach, and it instructs the agent to clone and
      `go build` a third-party binary onto the user's PATH — see README.md.

  using-tmux-for-interactive-commands:
    from: imported
    why: >-
      Experimental. Can fire unprompted on "run vim"; also trigger-overlaps
      moe-crew's driving-claude-code-sessions on the word tmux.

  windows-vm:
    from: imported
    why: >-
      Experimental, and it cannot run on this fork's dev machines or in CI —
      needs /dev/kvm, sshpass and Debian. See README.md.

  iterative-development:
    from: imported
    why: >-
      An alternative whole methodology, invoked by name when a spec is too
      large for the writing-plans flow.

  extracting-requirements:
    from: imported
    why: >-
      Part of the iterative-development cluster. Dispatched by the
      orchestrator, never reached on its own.

  scoping-the-simplest-core:
    from: imported
    why: >-
      Part of the cluster, and it reads a prompt template out of
      running-an-iteration's directory — the two cannot be split.

  running-an-iteration:
    from: imported
    why: >-
      Part of the cluster. Dispatches implementing-tasks.

  implementing-tasks:
    from: imported
    why: >-
      Part of the cluster. A fork of subagent-driven-development for
      in-memory task batches; only running-an-iteration invokes it.

  auditing-progress:
    from: imported
    why: >-
      Part of the cluster. The orchestrator's post-iteration gate.

  codebase-design:
    from: imported
    why: >-
      The shared design vocabulary
      (module/interface/depth/seam/adapter/leverage/locality) that
      test-driven-development's "Seams — Where Tests Go" section reaches for.
      Ships with DEEPENING.md and DESIGN-IT-TWICE.md.

  improve-codebase-architecture:
    from: imported
    why: >-
      Deliberately invoked, by name. Router-shaped: it scans, renders an HTML
      report of deepening candidates, then hands off — to brainstorming for
      the decision walk, to domain-modeling for CONTEXT.md/ADR updates.

  domain-modeling:
    from: imported
    why: >-
      Deliberately invoked when the domain model is being actively sharpened —
      writing or editing CONTEXT.md, recording an ADR. Merely READING
      CONTEXT.md is not this skill; this one edits.

  prototype:
    from: imported
    why: >-
      Deliberately invoked when the user wants a throwaway artifact to answer
      a design question: a single-file HTML logic demo, or a set of UI
      variants switchable via `?variant=`.


# ---------------------------------------------------------------------------
# authored: skills this fork wrote. OPEN.
#
# Same two keys as an imported entry: `from:` is always the value `moe`, and
# `why:` earns the skill's place the same way an imported one does.
# ---------------------------------------------------------------------------
authored:
  retrieving-context:
    from: moe
    why: >-
      A retrieval-discipline skill: "search before you answer" applied to the
      shared corpora that a coding agent's memory does not cover. Routes
      through the search-moedex agent when a corpus is configured, and to
      grep otherwise. Does not carry a **REQUIRED SUB-SKILL:** marker naming
      `remembering-conversations` — that skill lives in packages/memory and
      metadata.test.ts's strict marker rule resolves every backticked token
      against packages/core/skills/ only, so the marker would fail outright.
      Costs nothing: the routing rule reaches memory through its MCP *tools*,
      and tools are not skills.

  sequencing-plans:
    from: moe
    why: >-
      A deterministic scheduler for the multi-plan case that neither
      `writing-plans` nor `subagent-driven-development` covers. The description
      fires warm ("use when a project has more than one plan and you need to
      know which is runnable"); the cold case — a fresh session on a
      partly-finished project — is caught by the `plan-set-notice`
      SessionStart hook in `packages/core/hooks/`, which prints the ready
      set with no model in the loop. `plan-set` (the CLI) lives under
      `hooks/` rather than inside this skill's directory.

  reviewing-a-codebase:
    from: moe
    why: >-
      A whole-repository review you invoke on purpose — an inherited codebase,
      a pre-release sweep. Its description deliberately claims "a whole
      repository rather than a diff" because `requesting-code-review` already
      owns the diff trigger. Ships two node scripts invoked as `node <path>`,
      so neither needs an X_BIT_ALLOWLIST entry.

  fixing-a-code-review:
    from: moe
    why: >-
      The consumer half of the pair — it reads the report
      `reviewing-a-codebase` writes. Deliberately invoked once a report
      exists, so it cannot fire unasked. A REQUIRED four-field disposition
      slot plus the script that fills it, so a fix run cannot forget to
      record which commit fixed which finding.

  docs-update:
    from: moe
    why: >-
      Subagent-driven documentation generation and verification against the
      codebase. Dispatches one agent per doc type; each reads code before
      writing prose. Invoked deliberately with /docs-update.


# Not a skill: skills/_shared/ holds the three PAR reference documents the
# iterative-development cluster reads at runtime. It carries no SKILL.md, so
# moe-mint's readSkills() skips it, and it ships with the skills directory.
# It is in NEITHER map above — not `imported:`, not `authored:` — which is
# what scripts/mint-plugins.mjs's NON_SKILL_ENTRIES set exists to handle.
# Was skills/shared/ upstream; renamed to sort first and to signal that it is
# not a skill in a directory that now holds 27 of them.
