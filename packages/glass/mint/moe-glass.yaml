# moe-mint config for moe-glass.
#
# The platform registry resolves this source package and config. Compiled Mint
# assembles its declared components/payloads, exact validated adapter output,
# legal files, and root package metadata into the shared `plugins.next-<nonce>`
# sibling. This config remains source-only and is never copied into the plugin.

name: moe-glass
version: 0.1.4
description: >-
  Direct Chrome DevTools Protocol access. Skill mode plus MCP mode, zero
  dependencies.
author:
  name: Zak Keown
  email: zak.keown@outlook.com
license: MIT
repository: https://github.com/zak-keown/moe
homepage: https://github.com/zak-keown/moe
keywords:
  - chrome
  - devtools-protocol
  - browser
  - automation
  - screenshots

distribution:
  npm: "@bubstack/moe-glass"

artifact:
  payloads:
    - {from: dist, to: dist, required: true}

targets:
  claude-code: {intent: certify, expected_capabilities: [skill-discovery, agent-discovery], operating_systems: [macos, linux, wsl2, windows]}
  cursor: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2, windows]}
  codex: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2, windows]}
  kimi: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2, windows]}
  opencode: {intent: preview, expected_capabilities: [skill-discovery, agent-discovery], operating_systems: [macos, linux, wsl2, windows]}
  pi: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2, windows]}
  agent-plugins-1.0: {intent: preview, expected_capabilities: [skill-discovery, format-conformance]}
  copilot: {intent: preview, expected_capabilities: [skill-discovery, agent-discovery], operating_systems: [macos, linux, wsl2, windows]}

# bootstrap: none.
#
# `browsing` is a deliberate, invoked-by-name skill — you reach for a browser
# when you want a browser — so there is nothing to inject at session start. It is
# also the only skill here, so a bootstrap would load the entire plugin into
# every session for a capability most sessions never touch — a resident-context
# cost worth avoiding for a rarely-used skill.
bootstrap: none

# components: skills/ and agents/ are defaults. There is no hooks/hooks.json and
# no .mcp.json in the package: glass's MCP server is registered by the consumer,
# not shipped as a plugin-level .mcp.json, because the server key (`moe-glass`)
# has to match what the user's own config names.

imported_works:
  - name: superpowers-chrome

# harnesses: no exclusions. All 8 adapters run.

marketplace:
  # Standalone generation uses this package-local name. Root minting overrides
  # it with the default profile ID `core` and generates the npm-backed root
  # marketplace from validated registry authority.
  name: moe
  source: local
  category: development
  tags:
    - browser
    - automation
