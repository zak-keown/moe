# moe-mint config for moe-memory.
#
# The platform registry resolves this source package and config. Compiled Mint
# assembles its declared components/payloads, exact validated adapter output,
# legal files, and root package metadata into the shared `plugins.next-<nonce>`
# sibling. This config remains source-only and is never copied into the plugin.

name: moe-memory
version: 0.2.0
description: Semantic recall over past sessions and journal entries.
author:
  name: Zak Keown
  email: zak.keown@outlook.com
license: MIT
repository: https://github.com/zak-keown/moe
homepage: https://github.com/zak-keown/moe
keywords:
  - memory
  - search
  - embeddings
  - journal
  - mcp

distribution:
  npm: "@bubstack/moe-memory"

artifact:
  node_package:
    dependencies: bundled
  runtime_dependency_policy: bundled
  payloads:
    - {from: dist, to: dist, required: true}
    - {from: runtime, to: runtime, required: true}
    - {from: vendor/sqlite-vec, to: vendor/sqlite-vec, required: true}
    - {from: recovery, to: recovery, required: false}
    - {from: skills, to: skills, required: true}
    - {from: agents, to: agents, required: true}
    - {from: prompts, to: prompts, required: true}
    - {from: hooks, to: hooks, required: true}

targets:
  claude-code: {intent: certify, expected_capabilities: [skill-discovery, agent-discovery, hook-execution, mcp-registration, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}
  cursor: {intent: preview, expected_capabilities: [skill-discovery, hook-execution, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}
  codex: {intent: preview, expected_capabilities: [skill-discovery, hook-execution, mcp-registration], operating_systems: [macos, linux, wsl2, windows]}
  kimi: {intent: preview, expected_capabilities: [skill-discovery, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}
  opencode: {intent: preview, expected_capabilities: [skill-discovery, agent-discovery, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}
  pi: {intent: preview, expected_capabilities: [skill-discovery, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}
  agent-plugins-1.0: {intent: preview, expected_capabilities: [skill-discovery, mcp-registration, format-conformance]}
  copilot: {intent: preview, expected_capabilities: [skill-discovery, agent-discovery, hook-execution, mcp-registration, bootstrap-routing], operating_systems: [macos, linux, wsl2, windows]}

# bootstrap: skill.
#
# This is the one non-core plugin that earns a bootstrap. `remembering-conversations`
# has to fire WITHOUT being asked: the whole value is recalling something the user
# has forgotten they told you, and a skill you must remember to invoke cannot do
# that. It is the same argument that puts `using-moe` in the `moe` plugin.
bootstrap:
  skill: remembering-conversations

# components: skills/, agents/, hooks/hooks.json and .mcp.json are all defaults
# and all present. `.mcp.json` registers the `moe-memory` MCP server — a renamed
# identifier (upstream `episodic-memory`), recorded in NOTICE.
#
# hooks/hooks.json already registers memory's OWN SessionStart hook. mint merges
# its bootstrap entry alongside rather than replacing it, so both run. That is
# per-package behaviour, not mint-exclusive ownership of SessionStart.

imported_works:
  - name: episodic-memory
    artifact_roots: [agents/search-conversations.md, hooks/hooks.json, prompts/search-agent.md, dist/sync.d.ts, dist/sync.js, dist/sync-cli.d.ts, dist/sync-cli.js]
  - name: private-journal-mcp
    artifact_roots: [dist/journal/markdown.d.ts, dist/journal/markdown.js]
  - name: "@huggingface/tokenizers"
  - name: onnxruntime-web
  - name: sqlite-vec
  - name: proper-lockfile
  - name: marked

harnesses:
  codex:
    source_hooks: source

# All 8 adapters run (no exclusions).

marketplace:
  # Standalone generation uses this package-local name. Root minting overrides
  # it with the default profile ID `core` and generates the npm-backed root
  # marketplace from validated registry authority.
  name: moe
  source: local
  category: productivity
  tags:
    - memory
    - search
