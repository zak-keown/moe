# Replaces 11 GitHub Actions workflows across 7 upstream repositories.
# Inventory and porting notes: PARITY.md#ci-to-port
#
# The four upstream release workflows (obol crates.io + PyPI, smevals PyPI) are
# deliberately absent. They need a publish-publicly-or-not decision first.

stages: [install, check, build, release, publish]

default:
  image: node:24
  interruptible: true
  # Every current job uses a Docker executor. A future shell/Windows job must
  # override this instead of inheriting the Docker runner tag.
  tags: [docker-image]
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

variables:
  PNPM_HOME: /usr/local/bin
  TURBO_TELEMETRY_DISABLED: "1"

.pnpm: &pnpm
  before_script:
    - sh scripts/ci-safe-env safe corepack enable
    - sh scripts/ci-safe-env safe pnpm config set store-dir .pnpm-store
    - sh scripts/ci-safe-env safe pnpm install --frozen-lockfile

.not-scheduled:
  # The daily schedule exists only to compare TC convention pins. Ordinary
  # pushes and merge requests still run these jobs through the unconditional
  # fallback; scheduled pipelines inherit the fail-closed first rule.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: on_success

install:
  stage: install
  <<: *pnpm
  extends: .not-scheduled
  script: [sh scripts/ci-safe-env safe pnpm --version]

lint:
  stage: check
  <<: *pnpm
  extends: .not-scheduled
  script: [sh scripts/ci-safe-env safe pnpm lint]

typecheck:
  stage: check
  <<: *pnpm
  extends: .not-scheduled
  script: [sh scripts/ci-safe-env safe pnpm typecheck]

test:
  stage: check
  <<: *pnpm
  extends: .not-scheduled
  script: [sh scripts/ci-safe-env safe pnpm test]

build:
  stage: build
  <<: *pnpm
  extends: .not-scheduled
  script: [sh scripts/ci-safe-env safe pnpm build]

# Linux native release payloads are built from source on the Docker runners.
# The arm64 smoke runs its arm64 test process under qemu-user; it does not treat
# a file-header check as execution. Darwin payloads are intentionally absent
# from this job: they are tracked, hashed Apple-hardware outputs under
# packages/tab/native-release and Linux CI must never acquire an Apple SDK.
tab-native-linux:
  stage: build
  image: rust:1.98.0-bullseye
  before_script:
    - sh scripts/ci-safe-env rust apt-get update
    - sh scripts/ci-safe-env rust apt-get install --yes --no-install-recommends gcc-aarch64-linux-gnu jq libc6-dev-arm64-cross nodejs qemu-user
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes: [tc-release.json]
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - sh scripts/ci-safe-env rust cargo fetch --locked --manifest-path packages/tab/Cargo.toml
    - sh scripts/ci-safe-env rust env CARGO_NET_OFFLINE=true node scripts/tab-third-party-licenses.mjs --check
    - |
      sh scripts/ci-safe-env rust sh -c '
        TAB_RELEASE_VERSION=$(jq -r ".upstreamVersion + \"-tc.\" + (.tcRelease | tostring)" tc-release.json)
        export TAB_RELEASE_VERSION
        TAB_NATIVE_OUTPUT_DIR="$CI_PROJECT_DIR/.tc-tab-native" scripts/build-tab-native-linux.sh
      '
  artifacts:
    expire_in: 8 days
    paths: [.tc-tab-native/linux-*/*.so]

# /plugins/ is generated by moe-mint and COMMITTED, because
# .claude-plugin/marketplace.json sources each plugin as ./plugins/<name> — a
# consumer cloning this repo has to find it there. Committed generated output
# drifts the moment someone hand-edits a manifest, and a hand-edited manifest is
# invisible: it installs fine and silently disagrees with source.
#
# So this job regenerates and asserts the tree is byte-identical. It is the only
# thing standing between "plugins are generated" and "plugins were generated
# once, in 2026, and have been hand-patched since".
#
# Not path-scoped. A skill's frontmatter, a mint config, skill-tiers.yaml, the
# marketplace, moe-mint's own source and the generator script all change the
# output, which is most of the repo — a `changes:` rule broad enough to be
# correct would fire nearly always, and one narrow enough to skip usefully would
# miss the case this job exists for.
plugins:
  stage: check
  <<: *pnpm
  extends: .not-scheduled
  script: [sh scripts/ci-safe-env safe pnpm mint:check]

# ARCHITECTURE.md §8: provenance is preserved, self-reference is rewritten. The
# flight import broke that rule and a human caught it, not a check —
# packages/flight/README.md:336-338 records the correction. This job asserts every
# `## Forked from` table still names an upstream repo PARITY.md accounts for.
#
# No `<<: *pnpm`. The script reads markdown with node's stdlib and has no
# dependencies, so installing the workspace would cost a minute to change nothing.
#
# The second line is the job's own self-test. A checker nobody has seen fail is a
# checker nobody knows works, and this one has no live defect to fail on — so it
# runs against a fixture that IS misattributed and demands exit 1.
provenance:
  stage: check
  image: node:24
  extends: .not-scheduled
  script:
    - sh scripts/ci-safe-env safe node scripts/check-provenance.mjs
    # QUOTED DELIBERATELY. This entry contains a colon-space inside the echo
    # message, and an unquoted YAML plain scalar containing ": " parses as a
    # single-key MAP, not a string. GitLab requires every `script` entry to be a
    # string, and a map there is a job-config error that fails pipeline CREATION
    # — taking every other job down with it, not just this one.
    - "sh scripts/ci-safe-env safe sh -c \"if node scripts/check-provenance.mjs scripts/fixtures/provenance-red --min-readmes 1; then echo 'self-test failed: the red fixture passed'; exit 1; fi\""

# Structural drift-manifest validation is an ordinary offline gate. Remote SHA
# equality stays schedule-only below, but malformed, missing or extra rows must
# never wait for a scheduled pipeline to be discovered.
tc-drift-manifest:
  stage: check
  image: node:24
  extends: .not-scheduled
  script:
    - sh scripts/ci-safe-env safe node scripts/check-tc-drift-manifest.mjs
    - sh scripts/ci-safe-env safe node --test scripts/test/check-tc-drift-manifest.test.mjs

# Path-scoped: the dispatcher is Node stdlib only and every namespace is
# stubbed out in the vitest — a docs edit does not need to re-run it.
# See bin/moe.js and ARCHITECTURE.md §7.1 for what this covers.
bin:
  stage: check
  <<: *pnpm
  script: [sh scripts/ci-safe-env safe pnpm bin:test]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes: [bin/**/*]

# Path-scoped so a docs edit does not rebuild the Rust crate.
tab:
  stage: check
  image: rust:latest
  script: [sh scripts/ci-safe-env rust cargo test --manifest-path packages/tab/Cargo.toml]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes: [packages/tab/**/*]

proof:
  stage: check
  image: python:3.12
  before_script: [sh scripts/ci-safe-env safe pip install uv]
  # `--project` selects proof's environment, not pytest's discovery root.
  # Name the suite explicitly so a repo-root invocation cannot collect the
  # core and tab Python tests with proof's unrelated virtualenv.
  script: [sh scripts/ci-safe-env safe uv run --project py/proof pytest py/proof/tests]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - changes: [py/proof/**/*]

# Build every registry artifact and inspect the package.json inside each tarball.
# This job is deliberately separate from publishing: no registry write is
# possible until all eight artifacts have packed successfully and passed the
# downstream identity checks as a set. GitLab `needs` orders jobs; it does not
# share an earlier job's filesystem, so this job builds its own runtime output
# immediately before packing.
tc-release-pack:
  stage: release
  <<: *pnpm
  needs:
    - install
    - lint
    - typecheck
    - test
    - build
    - plugins
    - provenance
    - tc-drift-manifest
    - job: tab-native-linux
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      variables:
        NPM_DIST_TAG: next
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes: [tc-release.json]
      variables:
        NPM_DIST_TAG: latest
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
      variables:
        NPM_DIST_TAG: next
    - when: never
  script:
    - sh scripts/ci-safe-env safe node scripts/tab-third-party-licenses.mjs --check-inputs
    - sh scripts/ci-safe-env safe pnpm build
    - sh scripts/ci-safe-env safe node scripts/tc-release-pack.mjs --output-dir .tc-release --tab-native-dir .tc-tab-native
  artifacts:
    expire_in: 8 days
    paths: [.tc-release/*.tgz]

# Directly name every required gate in addition to the pack job. That makes the
# publication barrier visible in GitLab's needs graph and keeps later edits to
# tc-release-pack from accidentally weakening it.
tc-release-publish:
  stage: publish
  environment: proget-publish
  resource_group: tc-npm-release
  interruptible: false
  needs: [install, lint, typecheck, test, build, plugins, provenance, tc-drift-manifest, tc-release-pack]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_REF_PROTECTED == "true"'
      changes: [tc-release.json]
      variables:
        NPM_DIST_TAG: latest
    - when: never
  script:
    - sh scripts/ci-safe-env publish node scripts/tc-release-publish.mjs --artifacts-dir .tc-release

# Scheduled drift check for the TC merge-request conventions vendored into
# packages/core/skills/_shared/tc-conventions.md. One content pin protects the
# merge-request convention TC incorporates; two watch-only pins protect
# governance and guide dependencies whose movement also requires review.
#
# Schedule-only. The manifest itself only moves when a human bumps it, so a
# per-pipeline run would burn time reading four remote refs to conclude
# nothing changed. Set the schedule at Project -> CI/CD -> Schedules (daily is
# ample); pipelines from any other source skip the job.
#
# TC_GITLAB_TOKEN is a masked, protected variable holding a token with `read_api`
# scope on all three projects. The job soft-passes only when that variable is
# absent. A configured mismatch, malformed upstream response or explicit
# `<TC-BOOTSTRAP-PENDING>` row fails the remote equality check.
tc-conventions-drift:
  stage: check
  image: node:24
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      sh scripts/ci-safe-env drift sh -c '
        set -eu
        if [ -z "${TC_GITLAB_TOKEN:-}" ]; then
          echo "TC_GITLAB_TOKEN not set; skipping drift check (soft pass)."
          exit 0
        fi
        node scripts/check-tc-drift-manifest.mjs --check-remote
      '
