# Replaces 11 GitHub Actions workflows across 7 upstream repositories.
# Inventory and porting notes: PARITY.md#ci-to-port
#
# npm publishing (moe-memory, moe-glass) runs from the `publish` stage below on
# tags matching /^v/. The Rust and Python release workflows from upstream remain
# absent — they need to earn the same tag-triggered pipeline when their crates
# have consumers.

stages: [install, check, build, publish]

default:
  image: node:24
  interruptible: true
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

variables:
  PNPM_HOME: /usr/local/bin
  TURBO_TELEMETRY_DISABLED: "1"

.pnpm: &pnpm
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

install:
  stage: install
  <<: *pnpm
  script: [pnpm --version]

lint:
  stage: check
  <<: *pnpm
  script: [pnpm lint]

typecheck:
  stage: check
  <<: *pnpm
  script: [pnpm typecheck]

test:
  stage: check
  <<: *pnpm
  # System deps this suite reaches for that node:24 does not ship:
  #   jq   — packages/mint/checks/run-checks.sh parses/rewrites manifests
  #          with jq; without it the calls fail silently (2>/dev/null) and
  #          the run-checks.sh tests read correct fixtures as broken.
  #   lsof — packages/glass's chrome-launcher-helpers.findPidOnPort() shells
  #          out to `lsof -ti:<port> -sTCP:LISTEN`; without it findPidOnPort
  #          returns null and every test that relies on port→pid resolution
  #          (chrome-launcher-helpers, chrome-process getBrowserMode) fails.
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends jq lsof
    - pnpm install --frozen-lockfile
  script: [pnpm test]

build:
  stage: build
  <<: *pnpm
  script: [pnpm build]

# /plugins/ is generated by moe-mint and COMMITTED, because
# .claude-plugin/marketplace.json sources each plugin as ./plugins/<name> — a
# consumer cloning this repo has to find it there. Committed generated output
# drifts the moment someone hand-edits a manifest, and a hand-edited manifest is
# invisible: it installs fine and silently disagrees with source.
#
# So this job regenerates and asserts the tree is byte-identical. It is the only
# thing standing between "plugins are generated" and "plugins were generated
# once, in 2026, and have been hand-patched since".
#
# Not path-scoped. A skill's frontmatter, a mint config, skill-tiers.yaml, the
# marketplace, moe-mint's own source and the generator script all change the
# output, which is most of the repo — a `changes:` rule broad enough to be
# correct would fire nearly always, and one narrow enough to skip usefully would
# miss the case this job exists for.
plugins:
  stage: check
  <<: *pnpm
  script: [pnpm mint:check]

# ARCHITECTURE.md §8: provenance is preserved, self-reference is rewritten. The
# flight import broke that rule and a human caught it, not a check —
# packages/flight/README.md:336-338 records the correction. This job asserts every
# `## Forked from` table still names an upstream repo PARITY.md accounts for.
#
# No `<<: *pnpm`. The script reads markdown with node's stdlib and has no
# dependencies, so installing the workspace would cost a minute to change nothing.
#
# The second line is the job's own self-test. A checker nobody has seen fail is a
# checker nobody knows works, and this one has no live defect to fail on — so it
# runs against a fixture that IS misattributed and demands exit 1.
provenance:
  stage: check
  image: node:24
  script:
    - node scripts/check-provenance.mjs
    # QUOTED DELIBERATELY. This entry contains a colon-space inside the echo
    # message, and an unquoted YAML plain scalar containing ": " parses as a
    # single-key MAP, not a string. GitLab requires every `script` entry to be a
    # string, and a map there is a job-config error that fails pipeline CREATION
    # — taking every other job down with it, not just this one.
    - "if node scripts/check-provenance.mjs scripts/fixtures/provenance-red --min-readmes 1; then echo 'self-test failed: the red fixture passed'; exit 1; fi"

# Path-scoped: the dispatcher is Node stdlib only and every namespace is
# stubbed out in the vitest — a docs edit does not need to re-run it.
# See bin/moe.js and ARCHITECTURE.md §7.1 for what this covers.
#
# `if: $CI_COMMIT_TAG` → `when: never` is load-bearing: GitLab's `changes:`
# rule cannot compute a diff on a tag pipeline (there is no baseline commit),
# so it matches unconditionally and the path-scoped job would run on every
# tag. Tag pipelines only need install/lint/typecheck/test/build/plugins/
# provenance and the publish job — never a `changes:`-gated worker.
bin:
  stage: check
  <<: *pnpm
  script: [pnpm bin:test]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes: [bin/**/*]

# Path-scoped so a docs edit does not rebuild the Rust crate.
tab:
  stage: check
  image: rust:latest
  script: [cargo test --manifest-path packages/tab/Cargo.toml]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes: [packages/tab/**/*]

# The `proof` job tests packages/tab/bindings/python, which needs the native
# moe_tab module built from the Rust cdylib — machinery deferred with Wave 2
# of the MR-!1 carry-over. Runs only on non-tag pipelines when py/proof/**
# changed, until that machinery lands.
proof:
  stage: check
  image: python:3.12
  before_script: [pip install uv]
  script: [uv run --project py/proof pytest]
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - changes: [py/proof/**/*]

# Publishes the five @bubstack/moe-* packages to npm when a tag matching /^v/
# is pushed. Authenticates via OIDC "trusted publishing" — the npm CLI accepts
# a short-lived ID token minted by GitLab per job, verified against a trusted
# publisher pre-registered on each package at npmjs.com. No long-lived NPM_TOKEN
# is used or needed; see https://docs.npmjs.com/trusted-publishers.
#
# id_tokens.NPM_ID_TOKEN.aud must be `https://registry.npmjs.org` verbatim —
# npm's CLI reads that specific env var name to discover its OIDC token and
# rejects any other audience.
#
# --no-git-checks skips pnpm's "not on default branch" refusal (a tag pipeline
# is a detached HEAD, which pnpm otherwise rejects). `access` is on each
# package's own publishConfig, so it does not need to appear here.
#
# Each package's own prepack: `pnpm run build` rebuilds dist/ before pack —
# no separate build step needed here.
publish:
  stage: publish
  <<: *pnpm
  id_tokens:
    NPM_ID_TOKEN:
      aud: https://registry.npmjs.org
  script:
    # DIAGNOSTIC: decode and print the OIDC JWT claims so a mismatch with
    # each npm trusted-publisher config surfaces. JWT payloads are not
    # secret — the signature is what npm verifies. Remove once OIDC lands
    # green. `head -1` guards against an accidental multi-part token.
    - |
      python3 - <<'PY'
      import base64, json, os
      tok = os.environ.get('NPM_ID_TOKEN', '')
      print(f'NPM_ID_TOKEN present: {bool(tok)}  length: {len(tok)}')
      if tok:
          parts = tok.split('.')
          print(f'segments: {len(parts)}')
          if len(parts) >= 2:
              payload = parts[1] + '=' * (-len(parts[1]) % 4)
              claims = json.loads(base64.urlsafe_b64decode(payload))
              # Print in a fixed key order so a diff between runs is easy to spot.
              for k in ['iss','sub','aud','namespace_path','project_path','ref','ref_type','ref_path','ref_protected','ci_config_ref_uri','ci_config_sha','environment','pipeline_source']:
                  print(f'  {k}: {claims.get(k)}')
      PY
    - >-
      pnpm publish
      --filter @bubstack/moe-memory
      --filter @bubstack/moe-glass
      --filter @bubstack/moe-core
      --filter @bubstack/moe-crew
      --filter @bubstack/moe-backstory
      --no-git-checks
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
