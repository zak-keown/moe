# moe-mint config for the `moe` plugin.
#
# Preserved from the-elements-of-style's `everyharness.yaml` @ 05fc4f0 — the only
# real upstream consumer of the plugin generator, and therefore the seed of this
# pipeline. Every field below was rewritten; the file's shape and its habit of
# explaining each non-obvious choice in a comment are what survived.
#
# HOW THIS IS BUILT. moe-mint reads exactly `<root>/moe-mint.yaml` and uses one
# root for both config-in and files-out. So `scripts/mint-plugins.mjs` STAGES:
# it copies this file to `plugins/moe/moe-mint.yaml` along with every skill in
# the tree, then runs `moe-mint generate --dir plugins/moe`. The plugin root is
# therefore the staging directory, never `packages/core`.
#
# Two things fall out of that, and both were previously blockers:
#
#   - One plugin from one source tree. This used to be two — `moe-core` (a lean
#     everyday set) and `moe-everything` (all of them). Consolidated 2026-09-01:
#     the resident cost of shipping all 27 name+description pairs is roughly
#     1.5k tokens a session (bodies load on demand), which is not a budget
#     worth curating against, and having two plugins with a superset
#     relationship was more confusion than value at install time. `skill-tiers.yaml`
#     still records why each skill is here as a fidelity ledger; it no longer
#     partitions them.
#   - All 8 harness adapters can run. opencode and pi were excluded here
#     because they emit a FULL-REPLACEMENT package.json into the plugin root —
#     which used to be `packages/core`, whose package.json is the pnpm
#     workspace manifest. Against a staging root that file is just another
#     generated artifact, and `plugins/*` is not a pnpm workspace glob so
#     nothing picks it up.

name: moe
version: 0.1.2
# No skill count in the description, deliberately. A number in a SHIPPED
# description rots on the first authored skill, and it rots in twelve places at
# once because mint byte-copies this string into every harness manifest. The
# count lives in skill-tiers.yaml, where a test asserts it.
description: >-
  The Moe skill library — brainstorming, planning, TDD, systematic debugging,
  code review, worktrees, parallel dispatch, plugin authoring, and more.
author:
  name: Zak Keown
  email: zak.keown@outlook.com
license: MIT AND Apache-2.0
repository: https://gitlab.com/moe-ai/moe
homepage: https://gitlab.com/moe-ai/moe
keywords:
  - skills
  - brainstorming
  - planning
  - tdd
  - debugging
  - code-review
  - workflow
  - writing
  - plugin-authoring

# The bootstrap skill is what makes the rest fire without being asked for; every
# harness reads it at session start. moe-mint wraps it in
# `<plugin-bootstrap plugin="moe">` and marks it as already loaded.
bootstrap:
  skill: using-moe

# components: are all defaults (skills/, commands/, agents/, hooks/hooks.json,
# .mcp.json) and therefore omitted. This package has no commands/ and no
# .mcp.json. It does have agents/ — retrieving-context's search agent, picked
# up with no config change because agents/ is already a default component.
# hooks/hooks.json carries a Stop hook and a SessionStart hook, and mint
# merges its own SessionStart entry into hooks/moe-mint/hooks.json.

# harnesses: no exclusions. All 8 adapters run. opencode and pi used to be
# excluded here (see the header) and the staging root removed the reason.

marketplace:
  # The marketplace users actually install from is the hand-maintained root
  # .claude-plugin/marketplace.json, whose name is `moe`. Without this, every
  # generated install doc emits `<plugin>@<plugin>-dev` (the local-dev default
  # in src/adapters/shared.ts, marketplaceName) — a marketplace that does not
  # exist, in the one command a new user copies verbatim.
  name: moe
  # Local-dev descriptor only. The marketplace people actually install from is
  # the hand-maintained root .claude-plugin/marketplace.json, which lists every
  # Moe plugin and points at /plugins/<name>.
  source: local
  category: development
  tags:
    - skills
    - workflow

release:
  audit:
    # `moe-mint bump --audit` sweeps the plugin root for stray copies of the
    # current version string. It runs against the STAGING root, which holds only
    # skills/ and hooks/ — so entries this list used to carry that named
    # docs/history, licenses, or test/latte/scenarios are dropped as
    # out-of-scope. This one still is: the example plugin inside
    # developing-claude-code-plugins ships its own plugin.json with its own
    # version, which is not this plugin's.
    exclude:
      - skills/developing-claude-code-plugins/examples
