# moe-mint config for moe-crew.
#
# Built by `scripts/mint-plugins.mjs`, which stages this file plus the package's
# skills/ and hooks/ into `plugins/moe-crew/` and runs `moe-mint generate` there.

name: moe-crew
version: 0.1.4
description: Launch, control and monitor worker Claude sessions over tmux.
author:
  name: Zak Keown
  email: zak.keown@outlook.com
license: MIT
repository: https://github.com/zak-keown/moe
homepage: https://github.com/zak-keown/moe
keywords:
  - tmux
  - orchestration
  - subagents
  - sessions

distribution:
  npm: "@bubstack/moe-crew"

artifact:
  payloads:
    - {from: dist, to: dist, required: true}

targets:
  claude-code: {intent: certify, expected_capabilities: [skill-discovery, hook-execution], operating_systems: [macos, linux, wsl2]}
  cursor: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2]}
  codex: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2]}
  kimi: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2]}
  opencode: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2]}
  pi: {intent: preview, expected_capabilities: [skill-discovery], operating_systems: [macos, linux, wsl2]}
  agent-plugins-1.0: {intent: preview, expected_capabilities: [skill-discovery, format-conformance]}
  copilot: {intent: preview, expected_capabilities: [skill-discovery, hook-execution], operating_systems: [macos, linux, wsl2]}

# bootstrap: none. `driving-claude-code-sessions` is invoked when you already
# know you want a worker session; nothing about ordinary work should pull it in.
#
# Note for the WSL2 decision (ARCHITECTURE.md section 6): this plugin has no
# native-Windows story at all, because tmux does not exist there. Under WSL2 it
# works normally.
bootstrap: none

# components: skills/ is a default. hooks/hooks.json carries crew's own event
# emitter; mint merges its SessionStart entry into hooks/moe-mint/hooks.json
# rather than replacing this file.

imported_works:
  - name: claude-session-driver

# harnesses: no exclusions. All 8 adapters run.

marketplace:
  # The marketplace users actually install from is the hand-maintained root
  # .claude-plugin/marketplace.json, whose name is `moe`. Without this, every
  # generated install doc emits `<plugin>@<plugin>-dev` (the local-dev default
  # in src/adapters/shared.ts, marketplaceName) — a marketplace that does not
  # exist, in the one command a new user copies verbatim.
  name: moe
  source: local
  category: development
  tags:
    - orchestration
    - tmux
