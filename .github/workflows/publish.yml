# Publishes the six @bubstack/moe-* packages to npm when a tag matching /^v/
# is pushed. Authenticates via OIDC "trusted publishing" — pnpm/npm mint a
# short-lived ID token per job via ACTIONS_ID_TOKEN_REQUEST_URL, verified
# against a trusted publisher pre-registered on each package at npmjs.com.
# No long-lived NPM_TOKEN is used. See https://docs.npmjs.com/trusted-publishers
#
# Two-channel structure:
#   - Prerelease tags (v*-*): candidate branch — builds, checks, packs, publishes to `next`
#   - Stable tags (v* without -): promotion branch — downloads candidate, moves dist-tags to `latest`
#
# Both channels use the compiled Mint release CLI; no literal package list
# or source-directory publication path appears in this YAML.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: write

concurrency:
  group: moe-release
  cancel-in-progress: false

jobs:
  candidate:
    if: contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    container: node:24
    environment: release
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm config set store-dir .pnpm-store
      - run: pnpm install --frozen-lockfile

      - run: pnpm check
      - run: pnpm build
      - run: pnpm mint:check
      - run: pnpm provenance

      - name: prepare and publish candidate
        run: |
          node packages/mint/dist/cli.js release candidate \
            --tag "$GITHUB_REF_NAME" \
            --repo . \
            --execute

  promote:
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    container: node:24
    environment: release
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm config set store-dir .pnpm-store
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bubstack/moe-mint run build

      - name: promote to stable
        run: |
          node packages/mint/dist/cli.js release promote \
            --tag "$GITHUB_REF_NAME" \
            --repo . \
            --execute
