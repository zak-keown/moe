# Publishes the seven @bubstack/moe-* packages to npm when a tag matching /^v/
# is pushed. Authenticates via OIDC "trusted publishing" — pnpm/npm mint a
# short-lived ID token per job via ACTIONS_ID_TOKEN_REQUEST_URL, verified
# against a trusted publisher pre-registered on each package at npmjs.com.
# No long-lived NPM_TOKEN is used. See https://docs.npmjs.com/trusted-publishers
#
# This is the same publish path used for v0.1.4: Mint resolves the registry
# package matrix, then npm publishes each built source package with OIDC.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  id-token: write
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    container: node:24
    environment: release
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: .pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm config set store-dir .pnpm-store
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm mint:check
      - run: pnpm provenance

      - name: pick dist-tag
        id: dt
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: publish registry packages
        env:
          NPM_DIST_TAG: ${{ steps.dt.outputs.tag }}
        run: |
          set -eu
          MATRIX_PATH="$RUNNER_TEMP/moe-publish-matrix.json"
          node packages/mint/dist/cli.js publish-matrix --repo . > "$MATRIX_PATH"
          export MATRIX_PATH
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'

          const matrix = JSON.parse(readFileSync(process.env.MATRIX_PATH, 'utf8'))
          for (const entry of matrix) {
            console.log(`::group::publish ${entry.package}@${entry.version}`)
            const result = spawnSync('npm', ['publish', '--tag', process.env.NPM_DIST_TAG], {
              cwd: entry.sourcePackagePath,
              stdio: 'inherit',
            })
            if (result.status !== 0) process.exit(result.status ?? 1)
            console.log('::endgroup::')
          }
          NODE
