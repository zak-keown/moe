# Tests packages/tab/bindings/python. Runs only when py/proof/** changed.
name: proof

on:
  push:
    branches: [main]
    paths: [py/proof/**]
  pull_request:
    branches: [main]
    paths: [py/proof/**]

concurrency:
  group: proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    runs-on: ubuntu-latest
    container: python:3.12
    steps:
      - uses: actions/checkout@v4
      - run: pip install uv
      # Matches the root `proof:test` script's pytest scope — bare `pytest`
      # discovers packages/tab/bindings/python/tests which needs the cdylib
      # built first (excluded from CI per AGENTS.md "Not in CI").
      - run: uv run --project py/proof pytest py/proof
