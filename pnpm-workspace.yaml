# Eight TypeScript workspace packages. Two members are not pnpm packages and are
# driven by root scripts instead: packages/tab (cargo) and py/proof (uv).
packages:
  - 'packages/*'
  - 'packages/flight/ui'
  - 'packages/flight/dashboard'
  - 'packages/tab/bindings/typescript'

# Workspace packages resolve to each other by link, not from the registry.
linkWorkspacePackages: true

# pnpm 11 refuses to install until every postinstall script is approved by name
# (`allowBuilds`, which supersedes pnpm 10's `onlyBuiltDependencies`). esbuild
# arrives transitively via vitest and compiles a native binary. Leave an entry
# unresolved and `pnpm install --frozen-lockfile` fails in CI with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  # koffi is @bubstack/moe-tab's Node FFI backend and must compile. packages/crew
  # pulls it transitively too and does not need it (its pi-coding-agent dependency
  # is type-only) — but `true` is the resolution, because a skipped build breaks tab
  # and costs crew only a compile it never calls.
  koffi: true
  # Reached only through crew's type-only @earendil-works/pi-coding-agent. Nothing
  # in this repo executes pi, so neither needs to build.
  '@google/genai': false
  protobufjs: false
  # @huggingface/tokenizers has a native binary (napi-rs). Its install script
  # must run so the tokenizer can load in Node.
  '@huggingface/tokenizers': true
