# Eight TypeScript workspace packages. Two members are not pnpm packages and are
# driven by root scripts instead: packages/tab (cargo) and py/proof (uv).
packages:
  - 'packages/*'
  - 'packages/flight/ui'
  - 'packages/flight/dashboard'
  - 'packages/tab/bindings/typescript'

# Workspace packages resolve to each other by link, not from the registry.
linkWorkspacePackages: true

# pnpm 11 refuses to install until every postinstall script is approved by name
# (`allowBuilds`, which supersedes pnpm 10's `onlyBuiltDependencies`). esbuild
# arrives transitively via vitest and compiles a native binary. Leave an entry
# unresolved and `pnpm install --frozen-lockfile` fails in CI with
# ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  # koffi is @tc/moe-tab's Node FFI backend and must compile. packages/crew
  # pulls it transitively too and does not need it (its pi-coding-agent dependency
  # is type-only) — but `true` is the resolution, because a skipped build breaks tab
  # and costs crew only a compile it never calls.
  koffi: true
  # Reached only through crew's type-only @earendil-works/pi-coding-agent. Nothing
  # in this repo executes pi, so neither needs to build.
  '@google/genai': false
  protobufjs: false
  # The three below arrive with @tc/moe-memory and all three MUST build.
  # pnpm 11 wrote these three keys into this file itself during `pnpm install`,
  # as `set this to true or false` placeholders, and the install cannot complete
  # while they are unresolved — see packages/memory/README.md.
  #
  # better-sqlite3 is the store. Its native binding is compiled by
  # node-gyp/prebuild-install at install time; skip the build and every db.ts
  # call throws at require time, with no other symptom.
  better-sqlite3: true
  # onnxruntime-node is the ONNX backend transformers.js runs the embedding model
  # on. Its install script downloads the ORT binaries; without them the encoder
  # cannot load and both record types lose semantic search.
  onnxruntime-node: true
  # sharp arrives with @huggingface/transformers and is imported EAGERLY, so a
  # skipped build fails at module load rather than at first use. Nothing here
  # asks transformers.js to decode an image; the build is the price of importing
  # the library at all.
  sharp: true
